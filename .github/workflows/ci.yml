name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # bun.lock is the lockfile; npm still runs the package scripts.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck publishable server packages
        run: npm run typecheck:packages

      - name: Run tests
        run: bun test
        env:
          PERF_NO_TIME_ASSERT: "1"

  engine-packages:
    name: Engine packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # bun.lock is the lockfile; npm still runs the package scripts.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build engine packages
        run: |
          npm run build:packages -- --package @heswell/vuu-table
          npm run build:packages -- --package @heswell/vuu-viewport

      - name: Build server packages
        run: |
          npm run build:packages -- --package @heswell/module-admin
          npm run build:packages -- --package @heswell/service-utils
          npm run build:packages -- --package @heswell/vuu-server
          npm run build:packages -- --package @heswell/vuu-server-node
          npm run build:packages -- --package @heswell/vuu-portal

      - name: Pack (dry run)
        run: |
          for p in vuu-table vuu-viewport module-admin service-utils vuu-server vuu-server-node vuu-portal; do
            npm pack --dry-run ./dist/$p
          done

      - name: Smoke test built packages
        run: npm run test:engine-packages

      - name: Smoke test server packages on Node
        run: npm run test:node-runtime
