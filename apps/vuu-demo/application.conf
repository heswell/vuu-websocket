vuu.certPath="./certs/cert.pem"
vuu.keyPath="./certs/key.pem"
vuu.ssl=true
vuu.websocket.port=8091
vuu.websocket.port=${?VUU_WEBSOCKET_PORT}
services.refdata.url="ws://localhost:8081"
services.refdata.url=${?VUU_SERVICES_REFDATA_URL}
services.prices.url="ws://localhost:8082"
services.prices.url=${?VUU_SERVICES_PRICES_URL}
services.orders.url="ws://localhost:8083"
services.orders.url=${?VUU_SERVICES_ORDERS_URL}
services.equities.url="ws://localhost:8084"
services.equities.url=${?VUU_SERVICES_EQUITIES_URL}

vuu.https.port=8443
vuu.https.port=${?VUU_HTTPS_PORT}
vuu.auth.mode="permissive"
vuu.auth.mode=${?VUU_AUTH_MODE}
# Local no-TLS mode: with vuu.auth.mode="permissive" you may set vuu.ssl=false.
# The websocket is then plain ws:// and the REST server (/api/authn, admin api)
# is plain http:// on vuu.https.port; certPath/keyPath are not needed.
# vuu.ssl=false with any other auth mode (e.g. keycloak) refuses to start.
# Optional comma-separated username:password (or bare username) entries.
# Leave empty to allow any username with any password, including an empty one.
vuu.auth.permissive.users=""
vuu.auth.path="/api/authn"
# Browser origins allowed to call /api/authn (CORS); defaults to
# http://localhost:5002. A list, e.g. ["http://localhost:5002", "http://127.0.0.1:5002"],
# or a comma-separated VUU_CORS_ALLOWED_ORIGINS. See the vuu-server README.
vuu.auth.cors.allowedOrigins=${?VUU_CORS_ALLOWED_ORIGIN}
vuu.auth.cors.allowedOrigins=${?VUU_CORS_ALLOWED_ORIGINS}
# Unauthenticated development admin api (e.g. trigger notifications via curl).
# Never enable in production.
vuu.admin.enabled=false

# Log level: trace, debug, info, warn, error or silent. VUU_LOG_LEVEL overrides it.
# Per-logger overrides, e.g. vuu.log.levels.vuu.viewport=debug
vuu.log.level="info"
vuu.log.level=${?VUU_LOG_LEVEL}
