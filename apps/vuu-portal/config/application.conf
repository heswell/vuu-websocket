# Default vuu-portal configuration, bundled with the package. It is used when
# no conf is given: no --config, VUU_CONFIG_FILE or VUU_APP, and no
# ./application.conf in the current directory.
#
# Local development only: any username and password may log in, and the
# websocket and REST servers run without TLS. Every setting can be changed
# with the VUU_* environment variable next to it, or copy this file, edit it
# and pass --config.
#
# Relative paths in this file resolve against this directory (inside the
# installed package). The writable module catalogue (modules.yaml) is kept in
# the current directory instead, and VUU_PORTAL_MODULES_FILE, VUU_CERT_PATH,
# VUU_KEY_PATH and VUU_PORTAL_DEFAULT_MODULES_FILE resolve against the
# current directory.

vuu.auth.mode="permissive"
vuu.auth.mode=${?VUU_AUTH_MODE}
vuu.auth.path="/api/authn"
# Comma-separated username:password entries (or a bare username, for a user
# that may use any password). Empty allows any username with any password.
vuu.auth.permissive.users=""
vuu.auth.permissive.users=${?VUU_AUTH_PERMISSIVE_USERS}

# TLS is off by default: ws:// and http://. No certificate is shipped. To use
# TLS set VUU_SSL=true, VUU_CERT_PATH and VUU_KEY_PATH. vuu.ssl=false is only
# allowed with vuu.auth.mode="permissive".
vuu.ssl=false
vuu.ssl=${?VUU_SSL}
vuu.certPath=${?VUU_CERT_PATH}
vuu.keyPath=${?VUU_KEY_PATH}

vuu.websocket.path="/websocket-portal"
vuu.websocket.path=${?VUU_WEBSOCKET_PATH}
vuu.websocket.port=8091
vuu.websocket.port=${?VUU_WEBSOCKET_PORT}
vuu.https.port=8443
vuu.https.port=${?VUU_HTTPS_PORT}

# Browser origins allowed to call the REST auth endpoint (CORS).
# VUU_CORS_ALLOWED_ORIGINS replaces the list with a comma-separated list.
vuu.auth.cors.allowedOrigins=["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost:5001", "http://127.0.0.1:5001"]
vuu.auth.cors.allowedOrigins=${?VUU_CORS_ALLOWED_ORIGINS}

# Keycloak, used only with VUU_AUTH_MODE=keycloak. No secret is shipped.
vuu.keycloak.url=${?VUU_KEYCLOAK_URL}
vuu.keycloak.realm="vuu"
vuu.keycloak.realm=${?VUU_KEYCLOAK_REALM}
vuu.keycloak.allowSelfSignedCert=false
vuu.keycloak.allowSelfSignedCert=${?VUU_KEYCLOAK_ALLOW_SELF_SIGNED_CERT}
vuu.auth.keycloak.clientId="vuu-portal-server"
vuu.auth.keycloak.clientId=${?VUU_KEYCLOAK_CLIENT_ID}
vuu.auth.keycloak.audience="vuu-portal-server"
vuu.auth.keycloak.audience=${?VUU_KEYCLOAK_AUDIENCE}
vuu.auth.keycloak.audiencePolicy="require-audience"
vuu.auth.keycloak.authorizationClientId="vuu-portal"
vuu.auth.keycloak.expectedAuthorizedParty="vuu-portal"
vuu.auth.keycloak.tokenExchangeEnabled=false
vuu.auth.keycloak.clientSecret=${?VUU_KEYCLOAK_CLIENT_SECRET}

# The module catalogue. defaultModulesFile (read-only, in this directory)
# seeds modulesFile on first startup; runtime edits are saved to modulesFile.
vuu.portal.defaultModulesFile="default-modules.yaml"
vuu.portal.modulesFile="modules.yaml"
vuu.portal.moduleAdminRole="module-admin-access"
vuu.portal.moduleAdminRole=${?VUU_PORTAL_MODULE_ADMIN_ROLE}

# Log level: trace, debug, info, warn, error or silent.
vuu.log.level="info"
vuu.log.level=${?VUU_LOG_LEVEL}
