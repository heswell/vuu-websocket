# Reuse the repository development certificate. Production must configure its own paths.
vuu.certPath="../vuu-portal/certs/cert.pem"
vuu.keyPath="../vuu-portal/certs/key.pem"
vuu.ssl=true
vuu.websocket.path="/websocket-user-admin"
vuu.websocket.path=${?VUU_WEBSOCKET_PATH}
vuu.websocket.port=8092
vuu.websocket.port=${?VUU_WEBSOCKET_PORT}
vuu.https.port=8444
vuu.https.port=${?VUU_HTTPS_PORT}
vuu.auth.mode="keycloak"
vuu.auth.mode=${?VUU_AUTH_MODE}
vuu.auth.path="/api/authn"
vuu.auth.cors.allowedOrigin="http://localhost:5001"
vuu.auth.cors.allowedOrigin=${?VUU_CORS_ALLOWED_ORIGIN}
vuu.auth.permissive.users=""
vuu.keycloak.url="https://localhost:8080"
vuu.keycloak.url=${?VUU_KEYCLOAK_URL}
vuu.keycloak.realm="vuu"
vuu.keycloak.realm=${?VUU_KEYCLOAK_REALM}
# Local development only. Keep false when Keycloak uses a trusted certificate.
vuu.keycloak.allowSelfSignedCert=true
vuu.auth.keycloak.clientId="vuu-user-admin"
# Shared with the repository's local Keycloak bootstrap script.
vuu.auth.keycloak.clientSecret="vuu-user-admin-local-dev-secret"
vuu.auth.keycloak.audience="vuu-user-admin"
vuu.auth.keycloak.authorizationClientId="vuu-user-admin"
vuu.auth.keycloak.expectedAuthorizedParty="vuu-user-admin"
vuu.auth.keycloak.audiencePolicy="always-exchange"
vuu.auth.keycloak.tokenExchangeEnabled=true

# Keycloak Admin API credentials.
vuu.keycloak.adminRealm="master"
vuu.keycloak.adminUsername="admin"
vuu.keycloak.adminPassword="admin"
vuu.keycloak.clientId="admin-cli"
vuu.keycloak.clientSecret=""
vuu.keycloak.sync.intervalMs=10000
