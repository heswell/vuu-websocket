vuu.certPath="./certs/cert.pem"
vuu.keyPath="./certs/key.pem"
vuu.ssl=true
vuu.websocket.path="/websocket-basket-trading"
vuu.websocket.path=${?VUU_WEBSOCKET_PATH}
vuu.websocket.port=8093
vuu.websocket.port=${?VUU_WEBSOCKET_PORT}
vuu.https.port=8445
vuu.https.port=${?VUU_HTTPS_PORT}
# Unauthenticated development API. Disable in production.
vuu.admin.enabled=true
vuu.keycloak.url="https://localhost:8080"
vuu.keycloak.url=${?VUU_KEYCLOAK_URL}
vuu.keycloak.realm="vuu"
vuu.keycloak.realm=${?VUU_KEYCLOAK_REALM}
vuu.keycloak.allowSelfSignedCert=true
# Browser origins allowed to call the REST auth endpoint (CORS). A list, or a
# comma-separated string. The matching request Origin is echoed back. "*" is
# only accepted with vuu.auth.mode="permissive" and never sends credentials.
# VUU_CORS_ALLOWED_ORIGINS (or the legacy VUU_CORS_ALLOWED_ORIGIN) replaces
# the list with a comma-separated list. The legacy single-value key
# vuu.auth.cors.allowedOrigin is still read and merged with this list.
vuu.auth.cors.allowedOrigins=["http://localhost:5001", "http://127.0.0.1:5001"]
vuu.auth.cors.allowedOrigins=${?VUU_CORS_ALLOWED_ORIGIN}
vuu.auth.cors.allowedOrigins=${?VUU_CORS_ALLOWED_ORIGINS}
vuu.auth.path="/api/authn"
vuu.auth.keycloak.clientId="vuu-basket-trading"
vuu.auth.keycloak.clientSecret="vuu-basket-trading-local-dev-secret"
vuu.auth.keycloak.audience="vuu-basket-trading"
vuu.auth.keycloak.authorizationClientId="vuu-basket-trading"
vuu.auth.keycloak.expectedAuthorizedParty="vuu-basket-trading"
vuu.auth.keycloak.audiencePolicy="always-exchange"
vuu.auth.keycloak.tokenExchangeEnabled=true

# Log level: trace, debug, info, warn, error or silent. VUU_LOG_LEVEL overrides it.
# Per-logger overrides, e.g. vuu.log.levels.vuu.viewport=debug
vuu.log.level="info"
vuu.log.level=${?VUU_LOG_LEVEL}

# Trading rows auto-save together; prices are simulated, not persisted.
vuu.basket.persistence.enabled=true
vuu.basket.persistence.enabled=${?VUU_BASKET_PERSISTENCE_ENABLED}
vuu.basket.persistence.path="./data/basket-trading.json"
vuu.basket.persistence.path=${?VUU_BASKET_PERSISTENCE_PATH}
# Zero disables price ticking.
vuu.basket.prices.intervalMs=250
vuu.basket.prices.intervalMs=${?VUU_BASKET_PRICE_INTERVAL_MS}
