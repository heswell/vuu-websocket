vuu.certPath="./certs/cert.pem"
vuu.keyPath="./certs/key.pem"
vuu.ssl=true
vuu.websocket.path="/websocket-portal"
vuu.websocket.path=${?VUU_WEBSOCKET_PATH}
vuu.websocket.port=8091
vuu.websocket.port=${?VUU_WEBSOCKET_PORT}
vuu.https.port=8443
vuu.https.port=${?VUU_HTTPS_PORT}
vuu.auth.mode="keycloak"
vuu.auth.mode=${?VUU_AUTH_MODE}
vuu.auth.path="/api/authn"
# vuu.auth.mode="permissive"
# Local no-TLS mode: with vuu.auth.mode="permissive" you may set vuu.ssl=false.
# The websocket is then plain ws:// and the REST server (/api/authn, admin api)
# is plain http:// on vuu.https.port; certPath/keyPath are not needed.
# vuu.ssl=false with any other auth mode (e.g. keycloak) refuses to start.
# Optional in permissive mode. Comma-separated username:password entries.
# Leave empty to allow any non-empty username/password pair.
vuu.auth.permissive.users=""
vuu.auth.cors.allowedOrigin="http://localhost:5001"
vuu.auth.cors.allowedOrigin=${?VUU_CORS_ALLOWED_ORIGIN}
# Portal navigation validates the public portal token without exchanging it.
vuu.auth.keycloak.clientId="vuu-portal-server"
vuu.auth.keycloak.audience="vuu-portal-server"
vuu.auth.keycloak.audiencePolicy="require-audience"
vuu.auth.keycloak.authorizationClientId="vuu-portal"
vuu.auth.keycloak.expectedAuthorizedParty="vuu-portal"
vuu.auth.keycloak.tokenExchangeEnabled=false
vuu.auth.keycloak.clientSecret="vuu-portal-local-dev-secret"
vuu.portal.defaultModulesFile="default-modules.yaml"
vuu.portal.defaultModulesFile=${?VUU_PORTAL_DEFAULT_MODULES_FILE}
vuu.portal.modulesFile="modules.yaml"
vuu.portal.modulesFile=${?VUU_PORTAL_MODULES_FILE}
vuu.portal.moduleAdminRole="module-admin-access"

vuu.keycloak.url="https://localhost:8080"
vuu.keycloak.url=${?VUU_KEYCLOAK_URL}
vuu.keycloak.realm="vuu"
vuu.keycloak.realm=${?VUU_KEYCLOAK_REALM}
# Local development only. Keep false when Keycloak uses a trusted certificate.
vuu.keycloak.allowSelfSignedCert=true
