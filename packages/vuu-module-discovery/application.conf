# Reuse the repository development certificate. Production must configure its own paths.
vuu.certPath="../vuu-portal/certs/cert.pem"
vuu.keyPath="../vuu-portal/certs/key.pem"
vuu.ssl=true
vuu.websocket.port=8092
vuu.https.port=8444
vuu.moduleRegistry.port=9001
vuu.keycloak.url="https://localhost:8080"
vuu.keycloak.realm="vuu"
# Local development only. Keep false when Keycloak uses a trusted certificate.
vuu.keycloak.allowSelfSignedCert=true
vuu.auth.cors.allowedOrigin="http://localhost:5002"
vuu.auth.path="/api/authn"
vuu.auth.keycloak.clientId="vuu-module-discovery-server"
# Replace with the confidential client secret for vuu-module-discovery-server.
vuu.auth.keycloak.clientSecret="replace-with-module-discovery-client-secret"
vuu.auth.keycloak.audience="vuu-module-discovery-server"
vuu.auth.keycloak.audiencePolicy="exchange-if-needed"
vuu.auth.keycloak.tokenExchangeEnabled=true
